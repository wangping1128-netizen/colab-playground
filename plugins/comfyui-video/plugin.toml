api = 1
id = "comfyui-video"
version = "0.1.5"
# Optional: passed as PLUGIN_HF_TOKEN when saved on the Plugins page (needed only for gated repos such as LTX-2.5).
needs = ["hf_token"]

[name]
en = "ComfyUI Video Studio (MiniMax H3 / LTX-2.5 / Wan / Hunyuan)"
zh-CN = "ComfyUI 视频工作台（MiniMax H3 / LTX-2.5 / 万相 / 混元）"
zh-TW = "ComfyUI 影片工作台（MiniMax H3 / LTX-2.5 / 萬相 / 混元）"

[description]
en = "Deploy ComfyUI on a Colab GPU with built-in video workflow templates, ComfyUI-Manager, GGUF loader, and ready-to-run model packs for MiniMax H3, LTX-2.5, Wan 2.2, HunyuanVideo 1.5, and LTX-2.3 audio-video generation."
zh-CN = "在 Colab GPU 上一键部署 ComfyUI 视频生成工作台（内置官方视频模板、Manager 与 GGUF 节点），支持预装 MiniMax H3、LTX-2.5、通义万相 Wan 2.2、腾讯混元 HunyuanVideo 1.5 等最新开源音画同步视频模型。"
zh-TW = "在 Colab GPU 上一鍵部署 ComfyUI 影片生成工作台（內建官方影片範本、Manager 與 GGUF 節點），支援預裝 MiniMax H3、LTX-2.5、通義萬相 Wan 2.2、騰訊混元 HunyuanVideo 1.5 等最新開源音畫同步影片模型。"

[provision]
accelerator = "A100"
min_vram_mib = 0
high_mem = false

[[inputs]]
id = "preset"
type = "select"
options = [
  "minimax-h3-ti2v",
  "minimax-h3-r2v",
  "ltx2.5-22b-int8",
  "ltx2.5-22b-dfr",
  "wan2.2-ti2v-5b",
  "wan2.2-i2v-14b-fp8",
  "wan2.2-t2v-14b-fp8",
  "hunyuan1.5-720p-t2v",
  "hunyuan1.5-720p-i2v",
  "ltx2.3-22b-distilled-fp8",
  "ltx2.3-22b-dev-fp8",
  "none",
]
default = "wan2.2-ti2v-5b"
[inputs.label]
en = "Preloaded video model pack"
zh-CN = "预装视频模型包"
zh-TW = "預裝影片模型包"
[inputs.help]
en = "Top open A/V flagships: minimax-h3-ti2v (~42 GB, open download, T2V+I2V+stereo audio, runs on L4/A100), minimax-h3-r2v (~42 GB, multi-ref), ltx2.5-22b-int8 (~46 GB, gated HF_TOKEN, multishot/4K), ltx2.5-22b-dfr (~62 GB, A100). Re-run on the same session to add another pack."
zh-CN = "最新开源音画同步旗舰：minimax-h3-ti2v（约 42 GB，免 Token，文/图/首尾帧生立体声视频，L4/A100 均可跑）、minimax-h3-r2v（多参考图/视频/音频驱动）、ltx2.5-22b-int8（约 46 GB，需填免费 HF_TOKEN 并同意 Lightricks/LTX-2.5 协议，多镜头分镜+4K）、ltx2.5-22b-dfr（约 62 GB，推荐 A100）。可在「已有会话」上再次运行以增量追加模型包。"
zh-TW = "最新開源音畫同步旗艦：minimax-h3-ti2v（約 42 GB，免 Token，文/圖/首尾幀生立體聲影片，L4/A100 皆可跑）、minimax-h3-r2v（多參考圖/影片/音訊驅動）、ltx2.5-22b-int8（約 46 GB，需填免費 HF_TOKEN 並同意 Lightricks/LTX-2.5 協議，多鏡頭分鏡+4K）、ltx2.5-22b-dfr（約 62 GB，建議 A100）。可在「既有工作階段」上再次執行以增量追加模型包。"

[[inputs]]
id = "extra_downloads"
type = "text"
[inputs.label]
en = "Extra Hugging Face files (optional)"
zh-CN = "额外下载 Hugging Face 模型文件（可选）"
zh-TW = "額外下載 Hugging Face 模型檔案（選填）"
[inputs.help]
en = "Semicolon-separated entries in the form owner/repo:path/in/repo->models_subdir (e.g. Comfy-Org/Wan-Animate-2:split_files/diffusion_models/file.safetensors->diffusion_models)."
zh-CN = "按需追加任意 HF 权重（如 LTX-2.5、Wan-Animate、LoRA 或 GGUF），格式：owner/repo:仓库内路径->models子目录，多条用分号 ; 分隔。"
zh-TW = "按需追加任意 HF 權重（如 LTX-2.5、Wan-Animate、LoRA 或 GGUF），格式：owner/repo:儲存庫內路徑->models子目錄，多筆用分號 ; 分隔。"

[[inputs]]
id = "extra_nodes"
type = "text"
[inputs.label]
en = "Extra custom nodes (optional)"
zh-CN = "额外安装的第三方节点（可选）"
zh-TW = "額外安裝的第三方節點（可選）"
[inputs.help]
en = "Semicolon-separated GitHub repos (owner/repo[@ref]) or Comfy Registry IDs (pkg[@ver]), e.g. kijai/ComfyUI-KJNodes; rgthree-comfy."
zh-CN = "开机自动预装的第三方插件，分号 ; 分隔：支持 GitHub 仓库（owner/repo 或 owner/repo@commit）与 Comfy Registry 包名（如 kijai/ComfyUI-KJNodes; rgthree-comfy）。可直接粘贴同步助手生成的配方。"
zh-TW = "開機自動預裝的第三方外掛，分號 ; 分隔：支援 GitHub 儲存庫（owner/repo 或 owner/repo@commit）與 Comfy Registry 套件名（如 kijai/ComfyUI-KJNodes; rgthree-comfy）。可直接貼上同步助手產生的配方。"

[[inputs]]
id = "install_nodes"
type = "bool"
default = true
[inputs.label]
en = "Install ComfyUI-Manager, ComfyUI-GGUF & VideoHelperSuite"
zh-CN = "安装 ComfyUI-Manager、GGUF 与 VideoHelperSuite 节点"
zh-TW = "安裝 ComfyUI-Manager、GGUF 與 VideoHelperSuite 節點"
[inputs.help]
en = "Adds Manager (install any custom node from UI), ComfyUI-GGUF (.gguf diffusion weights), and VideoHelperSuite."
zh-CN = "安装插件管理器、GGUF 扩散模型加载节点和常用视频合成节点。"
zh-TW = "安裝外掛管理器、GGUF 擴散模型載入節點與常用影片合成節點。"

[[inputs]]
id = "vram_mode"
type = "select"
options = ["auto", "highvram", "normalvram", "lowvram"]
default = "auto"
[inputs.label]
en = "VRAM management mode"
zh-CN = "显存调度模式"
zh-TW = "顯示記憶體調度模式"
[inputs.help]
en = "auto picks highvram on 80 GB GPUs, normalvram on 24-48 GB GPUs, and lowvram under 20 GB."
zh-CN = "auto 会按分配到的显存自动匹配（80 GB 用 highvram，24-48 GB 用 normalvram，低于 20 GB 用 lowvram）。"
zh-TW = "auto 會依分配到的顯示記憶體自動匹配（80 GB 用 highvram，24-48 GB 用 normalvram，低於 20 GB 用 lowvram）。"

[[inputs]]
id = "port"
type = "number"
default = 8188
min = 1024
max = 65535
[inputs.label]
en = "Server port on the VM"
zh-CN = "VM 上的服务端口"
zh-TW = "VM 上的服務連接埠"
[inputs.help]
en = "Default is 8188 (port 8080 is reserved by Colab)."
zh-CN = "默认 8188（8080 为 Colab 保留端口不可用）。"
zh-TW = "預設 8188（8080 為 Colab 保留連接埠不可用）。"

[[inputs]]
id = "extra_args"
type = "text"
[inputs.label]
en = "Extra ComfyUI arguments (optional)"
zh-CN = "额外的 ComfyUI 启动参数（可选）"
zh-TW = "額外的 ComfyUI 啟動參數（選填）"

[run]
script = "worker.py"

[[stages]]
id = "detect"
[stages.label]
en = "Check GPU and disk"
zh-CN = "检查 GPU 与磁盘空间"
zh-TW = "檢查 GPU 與磁碟空間"

[[stages]]
id = "install"
[stages.label]
en = "Install ComfyUI and video nodes"
zh-CN = "部署 ComfyUI 与视频节点"
zh-TW = "部署 ComfyUI 與影片節點"

[[stages]]
id = "download"
[stages.label]
en = "Download video model weights"
zh-CN = "下载视频模型权重"
zh-TW = "下載影片模型權重"

[[stages]]
id = "server"
[stages.label]
en = "Start ComfyUI server"
zh-CN = "启动 ComfyUI 服务"
zh-TW = "啟動 ComfyUI 服務"

[[endpoints]]
id = "ui"
port_input = "port"
path = "/"
health = "/system_stats"
kind = "http"
[endpoints.label]
en = "ComfyUI Web Studio"
zh-CN = "ComfyUI 网页工作台"
zh-TW = "ComfyUI 網頁工作台"

[[keep]]
path = "/content/ComfyUI/output"
[keep.label]
en = "Generated videos and images"
zh-CN = "生成的视频与图片"
zh-TW = "產生的影片與圖片"
